name: Pons-Link CI

on:
  pull_request:
  push:
    branches:
      - main
      - main2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test:run
      - name: Run lint
        run: pnpm lint
      - name: Build frontend
        run: pnpm build
