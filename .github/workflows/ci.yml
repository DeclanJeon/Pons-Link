name: Pons-Link CI

on:
  pull_request:
  push:
    branches:
      - main
      - main2

env:
  TZ: Asia/Seoul
  VITE_SIGNALING_SERVER_URL: http://localhost:5500
  VITE_GOOGLE_CLIENT_ID: ci-google-client-id
  VITE_API_URL: http://localhost:6650
  VITE_PERSONAL_LINK_API_URL: http://localhost:6650
  VITE_SPEECH_TOKEN_API_URL: ''
  VITE_ENABLE_ANALYTICS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test:run
      - name: Run lint
        run: pnpm lint
      - name: Build frontend
        run: pnpm build
