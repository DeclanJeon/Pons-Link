name: Pons-Link Auto Version

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'docs/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'bun.lockb'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tsconfig.app.json'
      - 'tsconfig.node.json'

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/bump-version.mjs patch
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json VERSION_HISTORY.md
          git diff --cached --quiet || git commit -m "Auto version bump [skip version]"
          git push
