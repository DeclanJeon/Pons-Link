<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="PonsLink social preview">
  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="720" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030606" stop-opacity="0.96"/>
      <stop offset="0.58" stop-color="#050909" stop-opacity="0.84"/>
      <stop offset="1" stop-color="#050909" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="bottomShade" x1="0" y1="250" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030606" stop-opacity="0"/>
      <stop offset="1" stop-color="#030606" stop-opacity="0.76"/>
    </linearGradient>
    <linearGradient id="markBg" x1="84" y1="72" x2="146" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071111"/>
      <stop offset="0.56" stop-color="#0B1719"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <linearGradient id="bridge" x1="99" y1="109" x2="132" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5C16C"/>
      <stop offset="0.52" stop-color="#7EE7DF"/>
      <stop offset="1" stop-color="#EAFDFB"/>
    </linearGradient>
    <linearGradient id="room" x1="100" y1="88" x2="130" y2="123" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8DEBE4"/>
    </linearGradient>
    <filter id="markGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <image href="img/brand/ponslink-share-background.png" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="630" fill="url(#leftShade)"/>
  <rect width="1200" height="630" fill="url(#bottomShade)"/>

  <g>
    <rect x="82" y="70" width="66" height="66" rx="18" fill="url(#markBg)"/>
    <rect x="83" y="71" width="64" height="64" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <path d="M101 109C106.6 99.6 114.8 95.4 129 95.4" fill="none" stroke="url(#bridge)" stroke-width="4.4" stroke-linecap="round" filter="url(#markGlow)"/>
    <path d="M101 95.5C104.8 95.5 107.8 98.5 107.8 102.2C107.8 105.9 104.8 108.8 101 108.8C97.2 108.8 94.2 105.9 94.2 102.2C94.2 98.5 97.2 95.5 101 95.5Z" fill="#071111" stroke="#F7C56D" stroke-width="3"/>
    <path d="M129 88.7C132.8 88.7 135.8 91.7 135.8 95.4C135.8 99.1 132.8 102.1 129 102.1C125.2 102.1 122.2 99.1 122.2 95.4C122.2 91.7 125.2 88.7 129 88.7Z" fill="#071111" stroke="#9FF3EC" stroke-width="3"/>
    <path d="M107.5 88H117.2C120.5 88 123.2 90.7 123.2 94V114.5C123.2 117.8 120.5 120.5 117.2 120.5H107.5C104.2 120.5 101.5 117.8 101.5 114.5V94C101.5 90.7 104.2 88 107.5 88Z" fill="none" stroke="url(#room)" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M111.4 97.2H116.8M111.4 104.1H116.8M111.4 111H116.8" stroke="#EAFDFB" stroke-width="2.2" stroke-linecap="round" opacity="0.88"/>
    <text x="166" y="111" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F8FFFE">PonsLink</text>
    <text x="169" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8CB8B2">REQUEST TO ROOM</text>
  </g>

  <text x="82" y="252" font-family="Helvetica, Arial, sans-serif" font-size="68" fill="#FFFFFF">One personal link</text>
  <text x="82" y="324" font-family="Helvetica, Arial, sans-serif" font-size="68" fill="#FFFFFF">from request</text>
  <text x="82" y="396" font-family="Helvetica, Arial, sans-serif" font-size="68" fill="#CFFFFA">to live room.</text>

  <text x="84" y="464" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="-0.25" fill="#B8C9C7">Receive context, approve the meeting, and open</text>
  <text x="84" y="501" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="-0.25" fill="#B8C9C7">a secure voice or video session in one flow.</text>

  <path d="M84 548H381" stroke="#8DEBE4" stroke-width="2" stroke-linecap="round" opacity="0.72"/>
  <text x="84" y="585" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="650" letter-spacing="2.6" fill="#EFC37A">CONTEXT-RICH REQUESTS · HOST APPROVAL · LIVE SESSIONS</text>
